name: CI

# Continuous integration: every push to main and every pull request must pass
# lint, typecheck, unit tests, and a production build before merge.
#
# Secrets are optional. When a secret is absent (forks, first-time contributors,
# fresh clones) the workflow falls back to safe placeholders so the pipeline is
# still meaningful. Real deployments use the repository secrets.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # ── Safe placeholders so CI (and forks without secrets) can build ──────────
  DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/synthetix_ci' }}
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci-placeholder-secret-at-least-32-characters-long' }}
  BETTER_AUTH_URL: http://localhost:3000
  LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY || 'ci_placeholder_livekit_key' }}
  LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET || 'ci_placeholder_livekit_secret' }}
  NEXT_PUBLIC_LIVEKIT_URL: ${{ secrets.NEXT_PUBLIC_LIVEKIT_URL || 'wss://placeholder.livekit.cloud' }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'ci_placeholder_groq_key' }}
  NEON_STORAGE_ENDPOINT: ${{ secrets.NEON_STORAGE_ENDPOINT || 'https://placeholder.storage.neon.tech' }}
  NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.NEON_STORAGE_ACCESS_KEY_ID || 'ci_placeholder_access_key' }}
  NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NEON_STORAGE_SECRET_ACCESS_KEY || 'ci_placeholder_secret_key' }}
  NEON_STORAGE_BUCKET_NAME: ${{ secrets.NEON_STORAGE_BUCKET_NAME || 'synthetix-recordings' }}
  NEON_STORAGE_REGION: ${{ secrets.NEON_STORAGE_REGION || 'us-east-2' }}
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || 'https://placeholder.upstash.io' }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || 'ci_placeholder_upstash_token' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build
